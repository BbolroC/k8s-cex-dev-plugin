apiVersion: v1
kind: Pod
metadata:
  name: sharevol-docker-mdev
  namespace: customer-1
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: test
    image: quay.io/prometheus/busybox:latest
    command: ["tail", "-f", "/dev/null"]
    volumeMounts:
      - name: host-empty-vol
        mountPath: "/host/cache"
      - name: memory-empty-vol
        mountPath: "/tmp/cache"
    resources:
      limits:
        mdev.s390.ibm.com/CCA_for_customer_1: 1
  volumes:
  - name: host-empty-vol
    emptyDir: {}
  - name: memory-empty-vol
    emptyDir:
      medium: Memory
      sizeLimit: "50M"
