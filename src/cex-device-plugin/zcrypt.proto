syntax = "proto3";

package zcrypt;

// Option for Go code generation path
option go_package = "./zcryptpb"; // Adjust the path as needed

// The service definition.
service ZCryptManager {
  // RPC method to create the simple device node
  rpc CreateSimpleNode (CreateSimpleNodeRequest) returns (CreateSimpleNodeResponse) {}
  // RPC method to create a mediated device node
  rpc CreateMdevNode (CreateMdevNodeRequest) returns (CreateMdevNodeResponse) {}
  // RPC method to fetch active zcrypt nodes
  rpc FetchActiveNodes (FetchActiveNodesRequest) returns (FetchActiveNodesResponse) {}
  // RPC method to destroy a zcrypt node
  rpc DestroyNode (DestroyNodeRequest) returns (DestroyNodeResponse) {}
}

// The request message containing necessary info for node creation.
// Adapt this based on what zcryptCreateSimpleNode actually needs.
// It likely needs the device path or some identifier.
message CreateSimpleNodeRequest {
  string nodename = 1;       // An identifier for the specific zcrypt device
  int32 adapter = 2; // Maybe the path inside the container (ctrpath from Allocate?)
  int32 domain = 3; // Maybe the original host path (devpath from Allocate?)
  // Add any other parameters zcryptCreateSimpleNode requires
}

// The response message indicating success/failure and potentially the created path.
message CreateSimpleNodeResponse {
  bool success = 1;
  string node_path = 2;     // The path of the created node, if applicable
  string error_message = 3; // Detailed error message if success is false
}

// The request message for creating a mediated device node
message CreateMdevNodeRequest {
  string apqn = 1;  // The APQN in format "XX.XXXX"
}

// The response message for mediated device node creation
message CreateMdevNodeResponse {
  bool success = 1;
  string device_path = 2;  // The path of the created device node (e.g. /dev/vfio/N)
  string error_message = 3; // Error message if creation failed
}

// The request message for fetching active nodes
message FetchActiveNodesRequest {
  // Empty request as we just need to list all active nodes
}

// The response message containing active nodes
message FetchActiveNodesResponse {
  repeated string nodes = 1;  // List of active node names
  string error_message = 2;   // Error message if the operation failed
}

// The request message for destroying a node
message DestroyNodeRequest {
  string nodename = 1;  // The name of the node to destroy
}

// The response message for node destruction
message DestroyNodeResponse {
  bool success = 1;           // Whether the operation was successful
  string error_message = 2;   // Error message if the operation failed
}
