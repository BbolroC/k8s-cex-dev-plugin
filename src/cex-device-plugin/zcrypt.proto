syntax = "proto3";

package zcrypt;

// Option for Go code generation path
option go_package = "./zcryptpb"; // Adjust the path as needed

// The service definition.
service ZCryptManager {
  // RPC method to create the simple device node
  rpc CreateSimpleNode (CreateSimpleNodeRequest) returns (CreateSimpleNodeResponse) {}
  // RPC method to create a mediated device node
  rpc CreateMdevNode (CreateMdevNodeRequest) returns (CreateMdevNodeResponse) {}
  // RPC method to fetch active zcrypt nodes
  rpc FetchActiveNodes (FetchActiveNodesRequest) returns (FetchActiveNodesResponse) {}
  // RPC method to destroy a zcrypt node
  rpc DestroyNode (DestroyNodeRequest) returns (DestroyNodeResponse) {}
  // RPC method to check if a node exists
  rpc NodeExists (NodeExistsRequest) returns (NodeExistsResponse) {}
  // RPC method to check if zcrypt has nodes support
  rpc HasNodesSupport (HasNodesSupportRequest) returns (HasNodesSupportResponse) {}
  // RPC method to create shadow AP sysfs
  rpc MakeShadowApSysfs (MakeShadowApSysfsRequest) returns (MakeShadowApSysfsResponse) {}
  // RPC method to delete shadow AP sysfs
  rpc DelShadowSysfs (DelShadowSysfsRequest) returns (DelShadowSysfsResponse) {}
  // RPC method to fetch active shadow sysfs directories
  rpc FetchActiveShadows (FetchActiveShadowsRequest) returns (FetchActiveShadowsResponse) {}
  // RPC method to fetch available APQNs
  rpc ScanAPQNs (ScanAPQNsRequest) returns (ScanAPQNsResponse) {}
  // RPC method to get queue request counter
  rpc GetQueueRequestCounter (GetQueueRequestCounterRequest) returns (GetQueueRequestCounterResponse) {}
  // RPC method to check if zcrypt has AP support
  rpc HasApSupport (HasApSupportRequest) returns (HasApSupportResponse) {}
}

// The request message containing necessary info for node creation.
// Adapt this based on what zcryptCreateSimpleNode actually needs.
// It likely needs the device path or some identifier.
message CreateSimpleNodeRequest {
  string nodename = 1;       // An identifier for the specific zcrypt device
  int32 adapter = 2; // Maybe the path inside the container (ctrpath from Allocate?)
  int32 domain = 3; // Maybe the original host path (devpath from Allocate?)
  // Add any other parameters zcryptCreateSimpleNode requires
}

// The response message indicating success/failure and potentially the created path.
message CreateSimpleNodeResponse {
  bool success = 1;
  string node_path = 2;     // The path of the created node, if applicable
  string error_message = 3; // Detailed error message if success is false
}

// The request message for creating a mediated device node
message CreateMdevNodeRequest {
  string apqn = 1;  // The APQN in format "XX.XXXX"
}

// The response message for mediated device node creation
message CreateMdevNodeResponse {
  bool success = 1;
  string device_path = 2;  // The path of the created device node (e.g. /dev/vfio/N)
  string error_message = 3; // Error message if creation failed
}

// The request message for fetching active nodes
message FetchActiveNodesRequest {
  // Empty request as we just need to list all active nodes
}

// The response message containing active nodes
message FetchActiveNodesResponse {
  repeated string nodes = 1;  // List of active node names
  string error_message = 2;   // Error message if the operation failed
}

// The request message for destroying a node
message DestroyNodeRequest {
  string nodename = 1;  // The name of the node to destroy
}

// The response message for node destruction
message DestroyNodeResponse {
  bool success = 1;           // Whether the operation was successful
  string error_message = 2;   // Error message if the operation failed
}

// The request message for checking if a node exists
message NodeExistsRequest {
  string nodename = 1;
}

// The response message indicating whether the node exists
message NodeExistsResponse {
  bool exists = 1;
  string error_message = 2;
}

// The request message for checking if zcrypt has nodes support
message HasNodesSupportRequest {
  // Empty request as we just need to check system support
}

// The response message indicating whether zcrypt has nodes support
message HasNodesSupportResponse {
  bool has_support = 1;
  string error_message = 2;
}

// The request message for creating shadow AP sysfs
message MakeShadowApSysfsRequest {
  string id = 1;      // The ID for the shadow sysfs
  int32 adapter = 2;  // The adapter number
  int32 domain = 3;   // The domain number
}

// The response message for shadow AP sysfs creation
message MakeShadowApSysfsResponse {
  string shadow_path = 1;  // The path of the shadow AP bus directory
  string shadow_name = 2;  // The name of the shadow AP device directory
  string error_message = 3; // Error message if the operation failed
}

// The request message for deleting shadow AP sysfs
message DelShadowSysfsRequest {
  string id = 1;      // The ID of the shadow sysfs to delete
}

// The response message for shadow AP sysfs deletion
message DelShadowSysfsResponse {
  bool success = 1;           // Whether the operation was successful
  string error_message = 2;   // Error message if the operation failed
}

// The request message for fetching active shadow sysfs directories
message FetchActiveShadowsRequest {
  // Empty request as we just need to list all active shadow directories
}

// The response message containing active shadow sysfs directories
message FetchActiveShadowsResponse {
  repeated string shadows = 1;  // List of active shadow directory names
  string error_message = 2;     // Error message if the operation failed
}

// The request message for scanning APQNs
message ScanAPQNsRequest {
  bool verbose = 1;
}

// The APQN message type
message APQN {
  int32 adapter = 1;
  int32 domain = 2;
  string gen = 3;
  string mode = 4;
  bool online = 5;
}

// The response message for scanning APQNs
message ScanAPQNsResponse {
  repeated APQN apqns = 1;
  string error_message = 2;
}

// The request message for getting queue request counter
message GetQueueRequestCounterRequest {
  int32 adapter = 1;
  int32 domain = 2;
}

// The response message for getting queue request counter
message GetQueueRequestCounterResponse {
  int32 counter = 1;
  string error_message = 2;
}

// The request message for checking if zcrypt has AP support
message HasApSupportRequest {
}

// The response message for checking if zcrypt has AP support
message HasApSupportResponse {
  bool has_support = 1;
  string error_message = 2;
}
